<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeredalApp - Dashboard</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="bus 2.css">
</head>
<body>

    <div class="container-fluid">
        <div class="row">
            
            <!-- 1. MENÚ LATERAL (SIDEBAR) -->
            <nav class="col-auto sidebar d-flex flex-column p-3 text-white">
                <!-- Logo y título de la app -->
                <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                    <i class="bi bi-droplet-fill fs-3 text-info me-2"></i>
                    <span class="fs-4 fw-bold">VeredalApp</span>
                </a>
                <hr>
                <!-- Enlaces del menú -->
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item">
                        <a href="#" class="nav-link active" aria-current="page">
                            <i class="bi bi-speedometer2 me-2"></i> Dashboard
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-people me-2"></i> Usuarios
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-building me-2"></i> Organizaciones
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-water me-2"></i> Gestión del Agua
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-receipt me-2"></i> Facturación
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-wallet2 me-2"></i> Pagos
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-chat-dots me-2"></i> PQRS
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-bar-chart-line me-2"></i> Reportes
                        </a>
                    </li>
                    <li>
                        <a href="#" class="nav-link">
                            <i class="bi bi-gear me-2"></i> Configuración
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- 2. CONTENIDO PRINCIPAL -->
            <main class="col p-4">
                <!-- Barra Superior (Navbar / Header) -->
                <header class="d-flex justify-content-between align-items-center pb-3 mb-4 border-bottom">
                    <!-- Buscador -->
                    <div class="input-group w-50">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-start-0" placeholder="Buscar en VeredalApp...">
                    </div>

                    <!-- Perfil de Usuario y Notificaciones -->
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-light position-relative rounded-circle">
                            <i class="bi bi-bell"></i>
                            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">3</span>
                        </button>
                        <div class="d-flex align-items-center">
                            <span class="fw-bold me-2">Ana Torres</span>
                            <small class="text-muted">Administradora</small>
                        </div>
                    </div>
                </header>

                <!-- Área de contenido del Dashboard (Aquí irán las tarjetas y gráficos) -->
                <div class="container-fluid px-0">
                    <h2>Dashboard</h2>
                    <p class="text-muted">Resumen general de la gestión veredal</p>
                </div>
            </main>

        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
