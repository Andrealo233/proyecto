<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Personalizado</title>
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="bus 4.css" />
    <!-- (Opcional si usas Bootstrap para el modal) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card-form">
      <h2>Iniciar Sesión / Registro</h2>
      <form>
        <!-- Campo Nombre -->
        <div class="form-group mb-3">
          <label for="name" class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            name="name"
            id="name"
            placeholder="Tu nombre"
            required
          />
          <small id="helpId" class="form-text text-body-secondary"
            >Ingresa tu nombre completo</small
          >
        </div>

        <!-- Campo Correo Electrónico -->
        <div class="form-group mb-3">
          <label for="email" class="form-label email-label"
            >Correo Electrónico</label
          >
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="tucorreo@ejemplo.com"
            required
          />
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Mínimo 8 caracteres"
            required
          />
        </div>

        <!-- Confirmación de Contraseña -->
        <div class="form-group mb-3">
          <label for="passwordConfirm" class="form-label fw-semibold"
            >Confirmar Contraseña</label
          >
          <input
            type="password"
            class="form-control"
            id="passwordConfirm"
            placeholder="Vuelve a escribir tu contraseña"
            required
          />
        </div>

        <!-- Enlace de recuperación -->
        <div class="form-actions mb-3">
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Casilla de Términos y Condiciones -->
        <div class="form-group-checkbox mb-3">
          <input type="checkbox" id="terms" required />
          <label for="terms" class="fw-semibold ms-2"
            >Acepto los
            <a
              href="#"
              class="terms-link text-decoration-underline"
              style="color: #007bff"
              >términos y condiciones</a
            ></label
          >
        </div>

        <!-- Botón de Envío con degradado -->
        <button type="submit" class="btn-submit w-100">Enviar</button>
      </form>

      <!-- Sección para alternar vistas -->
      <div class="form-switch text-center mt-3">
        <p>¿Ya tienes una cuenta? <a href="#">Inicia sesión</a></p>
      </div>
    </div>

    <!-- SCRIPT DE JAVASCRIPT PARA EL MODAL (Opcional si usas Bootstrap) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const confirmModal = document.getElementById("confirmModal");
      if (confirmModal) {
        confirmModal.addEventListener("show.bs.modal", function (event) {
          const button = event.relatedTarget;
          const idItem = button.getAttribute("data-bs-id");
          const nombreItem = button.getAttribute("data-bs-nombre");

          const idSpan = confirmModal.querySelector("#modalIdText");
          const nombreP = confirmModal.querySelector("#modalNombreText");

          if (idSpan) idSpan.textContent = idItem;
          if (nombreP) nombreP.textContent = nombreItem;
        });
      }
    </script>
    <script>
              <!-- ========== MODAL DE CONFIRMACIÓN ========== -->
      <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">

            <div class="modal-header">
              <h5 class="modal-title" id="confirmModalLabel">Confirma tus datos</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">





              <!-- Contenedor para alertas dentro del modal -->
              <div id="modalAlertContainer"></div>

              <p class="mb-3">¿Son correctos estos datos?</p>
              <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item px-0"><strong>Usuario:</strong> <span id="confirmUsuario"></span></li>
                <li class="list-group-item px-0"><strong>Email:</strong> <span id="confirmEmail"></span></li>
                <li class="list-group-item px-0"><strong>Contraseña:</strong> <span id="confirmPassword"></span></li>
              </ul>
            </div>

            <div class="modal-footer">
              <button type="button" class="btn btn-outline-danger" id="btnCancelar">
                Cancelar
              </button>
              <button type="button" class="btn btn-success" id="btnConfirmar">
                Confirmar y registrar
              </button>
            </div>

          </div>
        </div>
      </div>
    </script>
  </body>
</html>
